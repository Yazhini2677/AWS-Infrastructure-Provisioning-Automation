[defaults]
inventory       = inventory/aws_ec2.yml
remote_user     = ec2-user
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml

[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Jump through the bastion host to reach private-subnet app instances.
# BASTION_IP is exported by the Jenkins pipeline from the Terraform output.
ssh_args = -o ProxyCommand="ssh -W %h:%p -q ec2-user@$BASTION_IP" -o StrictHostKeyChecking=no
