---
- name: Install nginx
  dnf:
    name: nginx
    state: present

- name: Deploy nginx reverse-proxy config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/{{ app_name }}.conf
    owner: root
    mode: "0644"
  notify: Reload nginx

- name: Remove default nginx welcome page config
  file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

- name: Ensure app directory exists
  file:
    path: "/opt/{{ app_name }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"

- name: Deploy systemd unit for the app
  template:
    src: app.service.j2
    dest: /etc/systemd/system/{{ app_name }}.service
    owner: root
    mode: "0644"
  notify: Reload systemd

- name: Ensure nginx is running and enabled
  service:
    name: nginx
    state: started
    enabled: true

- name: Ensure app service is running and enabled
  service:
    name: "{{ app_name }}"
    state: started
    enabled: true
